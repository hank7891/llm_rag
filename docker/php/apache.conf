ServerName localhost

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    # SSE 串流：關閉壓縮，否則回答會在最後整段出現（Apache 不認 X-Accel-Buffering）
    SetEnvIf Request_URI "/stream$" no-gzip=1 dont-vary=1

    # 串流最長 RAG_STREAM_TIME_LIMIT=600 秒，Apache 逾時要更長
    Timeout 660

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
