# 開發環境（Mac mini，2026-10-30 起）
# - Apache + PHP（app）、Queue Worker（queue）、MySQL、Qdrant：Docker
# - Ollama、llama-server：macOS 原生（Homebrew），容器以 host.docker.internal 連線
# 變數讀取根目錄 .env；尚未建立 .env 時使用預設值，所以可以先單獨啟動 Qdrant

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: llm_rag-php:8.3
    ports:
      - "8000:80"      # 維持 APP_URL=http://localhost:8000
    volumes:
      - .:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  queue:
    # 與 app 共用同一個 image，只由 app 建置
    image: llm_rag-php:8.3
    pull_policy: never
    # 與 Apache 同身分，避免 root 建立的 log、cache 讓 Apache 無法寫入
    user: www-data
    # 預設 --timeout=60 會在 Job 的 $timeout（80）之前殺掉子程序；須維持 Job timeout < 此值 < retry_after（90）
    command: php artisan queue:listen --timeout=85
    volumes:
      - .:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-rag_poc}
      MYSQL_USER: ${DB_USERNAME:-rag}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # FULLTEXT（Ch11）：中文以 2 字切詞；關閉停用詞，避免含 a、i 等單字母的英數編號搜不到。
      # 兩者只在啟動時讀取，修改後要重啟 MySQL 並重建 FULLTEXT 索引
      - --ngram_token_size=2
      - --innodb_ft_enable_stopword=OFF
    ports:
      - "33060:3306"   # 只供主機上的工具（TablePlus 等）連線；Laravel 在容器內連 mysql:3306
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    # 建議固定版本；若此 tag 不存在，改成 v1.19 或到 Docker Hub qdrant/qdrant 查最新版
    image: qdrant/qdrant:v1.19.0
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "6333:6333"   # REST + Web UI（/dashboard）
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mysql_data:
  qdrant_data:
